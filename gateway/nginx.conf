events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s;

    upstream auth_backend {
        zone auth_backend 64k;
        server auth-service:8000 max_fails=2 fail_timeout=10s;
    }

    upstream repo_backend {
        zone repo_backend 64k;
        server repo-service:8000 max_fails=2 fail_timeout=10s;
    }

    upstream git_backend {
        zone git_backend 64k;
        server git-service:8000 max_fails=2 fail_timeout=10s;
    }

    server {
        listen 80;

        location /api/auth/ {
            proxy_pass http://auth_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/repositories {
            proxy_pass http://repo_backend/repositories;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/repos/ {
            proxy_pass http://git_backend/repos/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 '{"status":"gateway healthy"}';
            add_header Content-Type application/json;
        }
    }
}