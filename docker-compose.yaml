services:

  db-primary:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--wal-segsize=16"
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c max_replication_slots=5
      -c hot_standby=on
    volumes:
      - db-primary-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./db/replication.sh:/docker-entrypoint-initdb.d/02-replication.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-replica:
    image: postgres:15
    restart: unless-stopped
    environment:
      PGUSER: replicator
      PGPASSWORD: ${REPLICATION_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    user: postgres
    command: |
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/*
        until pg_basebackup -h db-primary -D /var/lib/postgresql/data -U replicator -R -w; do
          echo 'Waiting for primary...'
          sleep 2
        done
        chmod 0700 /var/lib/postgresql/data
      fi
      postgres
      "
    volumes:
      - db-replica-data:/var/lib/postgresql/data
    depends_on:
      db-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./auth-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-primary:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db-primary:
        condition: service_healthy

  repo-service:
    build: ./repo-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-primary:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      db-primary:
        condition: service_healthy

  git-service:
    build: ./git-service
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      REPO_SERVICE_URL: http://repo-service:8000
      TIMING: ${TIMING:-0}
    volumes:
      - ./repos-data:/repos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./repos-data:/repos:ro
    depends_on:
      - auth-service
      - repo-service
      - git-service

volumes:
  db-primary-data:
  db-replica-data: